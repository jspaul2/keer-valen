<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valentine's Voice Command Game</title>
    <style>
      body {
        font-family: "Cursive", cursive;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #ffcccc, #ffe6e6);
        color: #8b0000;
        text-shadow: 2px 2px 4px rgba(255, 0, 0, 0.7);
      }
      h1 {
        font-size: 3rem;
        margin-bottom: 20px;
        color: #8b0000;
      }
      img {
        width: 450px;
        height: 450px;
        object-fit: cover;
        border-radius: 20%;
        border: 5px solid #fff;
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        transition: transform 0.3s ease-in-out;
        margin-bottom: 30px;
      }
      img:hover {
        transform: scale(1.1);
      }
      button {
        padding: 15px 30px;
        font-size: 18px;
        font-weight: bold;
        margin: 10px;
        cursor: pointer;
        border-radius: 25px;
        border: none;
        transition: all 0.3s;
        color: white;
      }
      .start {
        background-color: #ff4d4d;
        box-shadow: 0 0 10px #ff4d4d;
      }
      .stop {
        background-color: #ff9999;
        box-shadow: 0 0 10px #ff9999;
      }
      button:hover {
        transform: translateY(-3px);
        opacity: 0.9;
      }
      .typing-effect {
        font-size: 1.5rem;
        color: #8b0000;
        border-right: 2px solid #8b0000;
        white-space: nowrap;
        overflow: hidden;
        max-width: 840px;
        animation: typing 8s steps(60, end), blink-caret 0.75s step-end infinite;
      }

      @keyframes typing {
        from {
          width: 0;
        }
        to {
          width: 100%;
        }
      }

      @keyframes blink-caret {
        from,
        to {
          border-color: transparent;
        }
        50% {
          border-color: #8b0000;
        }
      }
      .you-said {
        color: #2e8b57;
        font-weight: bold;
        font-size: 1.5rem;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        margin-right: 10px;
      }
      .recognized-word {
        color: #ff4500;
        font-weight: bold;
        font-size: 1.4rem;
        text-decoration: underline;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <h1>Jixie Wiper</h1>
    <p class="typing-effect">
      Say the magical word to reveal the wiper, and command it to go left or
      right as you wish!
    </p>
    <img
      id="displayImage"
      src="assets/images/left.jpg"
      style="display: none"
      alt="Wiper"
    />
    <div id="circularElement" style="display: none"></div>
    <div>
      <button class="start" id="startButton" onclick="startListening()">
        ▶&nbsp; Say Command
      </button>
      <button
        class="stop"
        id="stopButton"
        style="display: none"
        onclick="stopListening()"
      >
        ⏹ End
      </button>
    </div>

    <!-- Add this section below the buttons -->
    <div id="outputSection" style="display: none">
      <p>
        <span class="you-said">You said :</span>
        <span class="recognized-word" id="recognizedWord"></span>
      </p>
    </div>

    <audio
      id="audioPlayer"
      src="assets/audio/K, I Wanna Be Yours .mp3"
      preload="auto"
    ></audio>

    <script>
      let recognition;
      function startListening() {
        const SpeechRecognition =
          window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert(
            "Your browser does not support speech recognition. Use Chrome."
          );
          return;
        }

        document.getElementById("startButton").innerText = "Listening...";

        document.getElementById("stopButton").style.display = "inline-block";

        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.lang = "en-US";

        recognition.onresult = (event) => {
          const command = event.results[event.results.length - 1][0].transcript
            .trim()
            .toLowerCase();
          handleVoiceCommand(command);
        };

        recognition.onerror = (event) => {
          console.error("Error:", event.error);
        };

        recognition.start();
      }

      function stopListening() {
        // Show confirmation dialog
        const confirmStop = confirm("Are you gonna stop watching my wiper :(");
        if (confirmStop) {
          location.reload(); // Reload the page if confirmed
        }
      }

      function handleVoiceCommand(command) {
        document.getElementById("recognizedWord").innerText = command;
        document.getElementById("outputSection").style.display = "block";

        if (
          command.toLowerCase() === "wiper" ||
          command.toLowerCase() === "viper"
        ) {
          document.getElementById("displayImage").style.display = "block";
          document.getElementById("circularElement").style.display = "block";
        } else if (command.toLowerCase() === "left") {
          document.getElementById("displayImage").src =
            "assets/images/left.jpg";
        } else if (command.toLowerCase() === "right") {
          document.getElementById("displayImage").src =
            "assets/images/right.jpg";
        } else if (command.toLowerCase() === "music") {
          document.getElementById("audioPlayer").play();
        }
      }
    </script>
  </body>
</html>
